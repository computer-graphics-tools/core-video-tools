name: Test Swift Package

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: '5.9'

    - name: Build
      run: swift build

    - name: Build for tvOS Simulator
      run: xcodebuild -scheme core-video-tools -destination 'generic/platform=tvOS Simulator' build

    - name: Run Tests
      run: swift test
